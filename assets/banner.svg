<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d">
<title id="t">Daniel Steven de la Rosa Narváez</title>
<desc id="d">Un muñequito de píxeles recorre un camino, salta para golpear bloques con íconos y llega a una bandera.</desc>
<defs><pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2a3346"/></pattern></defs>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.name { font-size: 38px; font-weight: 700; fill: #f4f6fb; }
.sub { font-size: 20px; fill: #9aa7bd; }
.code { font-size: 22px; font-weight: 700; fill: currentColor; }
.walker { animation: walk 16s linear infinite; }
.jumper { animation: jump 16s linear infinite; }
.legs-a { animation: frame-a .44s steps(1) infinite; }
.legs-b { animation: frame-b .44s steps(1) infinite; }
.wave { animation: wave 16s linear infinite; transform-origin: 900px 280px; }
@keyframes walk {
  0% { transform: translateX(70px); opacity: 0; }
  2% { opacity: 1; }
  86% { transform: translateX(880px); }
  97% { transform: translateX(880px); opacity: 1; }
  100% { transform: translateX(880px); opacity: 0; }
}
@keyframes jump { 0%{transform:translateY(0)} 11.46%{transform:translateY(0)} 14.86%{transform:translateY(-34px)} 18.26%{transform:translateY(0)} 29.51%{transform:translateY(0)} 32.91%{transform:translateY(-34px)} 36.31%{transform:translateY(0)} 47.56%{transform:translateY(0)} 50.96%{transform:translateY(-34px)} 54.36%{transform:translateY(0)} 65.61%{transform:translateY(0)} 69.01%{transform:translateY(-34px)} 72.41%{transform:translateY(0)} 100%{transform:translateY(0)} }
@keyframes frame-a { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes frame-b { 0% { opacity: 0; } 50% { opacity: 1; } }
@keyframes wave {
  0%, 85% { opacity: .35; transform: scaleY(1); }
  87% { opacity: 1; transform: scaleY(1.12); }
  89%, 97% { opacity: 1; transform: scaleY(1); }
  100% { opacity: .35; }
}

.b0 { animation: bump0 16s linear infinite; }
@keyframes bump0 {
  0%, 14.46% { transform: translateY(0); opacity: .38; }
  15.86% { transform: translateY(-12px); opacity: 1; }
  17.46%, 97% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(0); opacity: .38; }
}
.b1 { animation: bump1 16s linear infinite; }
@keyframes bump1 {
  0%, 32.51% { transform: translateY(0); opacity: .38; }
  33.91% { transform: translateY(-12px); opacity: 1; }
  35.51%, 97% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(0); opacity: .38; }
}
.b2 { animation: bump2 16s linear infinite; }
@keyframes bump2 {
  0%, 50.56% { transform: translateY(0); opacity: .38; }
  51.96% { transform: translateY(-12px); opacity: 1; }
  53.56%, 97% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(0); opacity: .38; }
}
.b3 { animation: bump3 16s linear infinite; }
@keyframes bump3 {
  0%, 68.61% { transform: translateY(0); opacity: .38; }
  70.01% { transform: translateY(-12px); opacity: 1; }
  71.61%, 97% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(0); opacity: .38; }
}
@media (prefers-reduced-motion: reduce) {
  .walker, .jumper, .legs-a, .legs-b, .wave, .b0, .b1, .b2, .b3 { animation: none; }
  .walker { transform: translateX(70px); }
  .legs-b { opacity: 0; }
}
</style>
<rect width="1000" height="320" rx="18" fill="#0f1420"/>
<rect width="1000" height="320" rx="18" fill="url(#p)"/>
<text x="56" y="78" class="name">Daniel Steven de la Rosa Narváez</text>
<text x="56" y="114" class="sub">Ingeniería de Sistemas e Informática · UNAL Medellín</text>
