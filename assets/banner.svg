<g class="wave"><rect x="898" y="196" width="5" height="84" fill="#c7d0e0"/><path d="M903 198 L948 214 L903 230 Z" fill="#f5b942"/></g>
<g class="walker"><g class="jumper"><g transform="translate(0 224)"><rect x="8" y="0" width="24" height="8" fill="#3a2a20"/><rect x="4" y="4" width="4" height="8" fill="#3a2a20"/><rect x="32" y="4" width="4" height="4" fill="#3a2a20"/><rect x="8" y="8" width="24" height="12" fill="#e8b48a"/><rect x="8" y="8" width="4" height="4" fill="#3a2a20"/><rect x="24" y="12" width="4" height="4" fill="#10141c"/><rect x="8" y="20" width="24" height="20" fill="#2dd4bf"/><rect x="4" y="24" width="4" height="12" fill="#1a9e8e"/><rect x="32" y="24" width="4" height="12" fill="#1a9e8e"/><rect x="4" y="36" width="4" height="4" fill="#e8b48a"/><rect x="32" y="36" width="4" height="4" fill="#e8b48a"/><g class="legs-a"><rect x="8" y="40" width="8" height="12" fill="#46557a"/><rect x="24" y="40" width="8" height="12" fill="#46557a"/><rect x="8" y="52" width="12" height="4" fill="#f4f6fb"/><rect x="24" y="52" width="12" height="4" fill="#f4f6fb"/></g><g class="legs-b"><rect x="16" y="40" width="8" height="12" fill="#46557a"/><rect x="16" y="52" width="12" height="4" fill="#f4f6fb"/></g></g></g></g>
</svg>
